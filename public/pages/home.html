<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Home</title>
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/auth.js" defer></script>
</head>
<body>
    <div id="loading">Carregando...</div>

    <div class="areaTrabalho">
        <div class="pasta" onclick="window.location='/pages/lista.html'">
            <img class="iconePasta" src="../assets/pasta.png" alt="">
            <span class="nomePasta">Lista Para Impressão</span>
        </div>

        <div class="pasta" onclick="window.location='/pages/dashboard.html'">
            <img class="iconePasta" src="../assets/pasta.png" alt="">
            <span class="nomePasta">Dashboard</span>
        </div>
    </div>

    <div id="barraInferior">
        <button id="menu" type="button" onclick="abreFechaMenu()">Start</button>

        <div id="menuItens">
            <div class="itemMenu" onclick="window.location.href='login.html'">Login</div>
            <div class="itemMenu" onclick="window.location.href='cadastro.html'">Cadastro</div>
            <div class="itemMenu" onclick="window.location.href='index.html'">Logout</div>
        </div>
    </div>
</body>
</html>
<script>
//-------------------------------------------------------------

function esconderLoading() {
    let loadingEl = document.getElementById('loading');

    if (loadingEl) {
        loadingEl.style.display = 'none';
    }
}
//-------------------------------------------------------------

let menuAberto = false;
let usuarioId = sessionStorage.ID_USUARIO;
let menuItens = document.getElementById('menuItens');
let div_mensagem = document.getElementById("codigo");

function abreFechaMenu() {
    if (menuAberto) {
        menuItens.style.display = 'none';
        menuAberto = false;
        document.getElementById('menu').style.borderColor = '#ffffff #5a5a5a #5a5a5a #ffffff';
    } else {
        menuItens.style.display = 'block';
        menuAberto = true;
        document.getElementById('menu').style.borderColor = '#5a5a5a #ffffff #ffffff #5a5a5a';
    }
}

esconderLoading();
</script>
