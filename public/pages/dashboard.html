<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Casamento</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="../js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/sidebar.js" defer></script>
    <script src="../js/dashboard.js" defer></script>
</head>
<body>

<div id="loading" style="
    position:fixed;
    inset:0;
    background: #f6e7ec;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: monospace;
    font-size: 20px;
    z-index: 999;
">
    Carregando...
</div>

<div class="sidebar">
    <div class="active" onclick="dashboard()">Dashboard</div>
    <div onclick="lista()">Lista</div>
    <div onclick="login()">Login</div>
    <div onclick="cadastro()">Cadastro</div>
    <div id="sair" onclick="logout()">Logout</div>
</div>

<div class="container0">
    <div class="left-section">
        <div class="kpis">
            <div class="kpi">
                <h3>Convidados</h3>
                <span id="totalConvidados">0</span>
            </div>
            <div class="kpi">
                <h3>Acúmulo</h3>
                <span id="totalMeta">R$ 0</span>
            </div>
            <div class="kpi">
                <h3>Contagem Regressiva</h3>
                <div id="countdown">
                    <span id="cdDias">--</span>dias
                    <span id="cdHoras">--</span>h
                    <span id="cdMin">--</span>m
                    <span id="cdSeg">--</span>s
                </div>
            </div>
        </div>

        <div class="charts">
            <div class="chart">
                <canvas id="linhaGrafico"></canvas>
            </div>
            <div id="avisoMeta" style="display: none;">
                Parabens! Voce atingiu a meta de economia!
            </div>
            <div class="chart">
                <canvas id="barraGrafico"></canvas>
            </div>
        </div>
    </div>
        
    <div class="right-section">
            <div class="card">
                <h2>Convidados</h2>
                <input type="text" id="input_convidado" placeholder="Nome do convidado...">
                <button onclick="addConvidado()">Adicionar Convidado</button>
                <div class="lista" id="listaConvidados"></div>
            </div>
            
            <div class="card">
                <h2>Economia</h2>
                <input type="number" id="input_economia" placeholder="Valor economizado...">
                <button onclick="addEconomia()">Adicionar Economia</button>
                <div class="lista" id="listaEconomia"></div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
