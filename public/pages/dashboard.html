<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Casamento</title>
    <link rel="stylesheet" href="../css/dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/dashboard.js" defer></script>

</head>
<body>

<div class="sidebar">
    <div class="nav-item" onclick="window.location.href='/pages/index.html'">Home</div>
    <div class="nav-item" onclick="window.location.href='/pages/dashboard.html'">Dashboard</div>
    <div class="nav-item" onclick="window.location.href='/pages/login.html'">Login</div>
    <div class="nav-item" onclick="window.location.href='/pages/cadastro.html'">Cadastro</div>
</div>

<div class="container0">

    <div class="left-section">
        <div class="kpis">
            <div class="kpi">
                <h3>Convidados</h3>
                <span id="totalConvidados">0</span>
            </div>
            <div class="kpi">
                <h3>Acúmulo</h3>
                <span id="totalMeta">R$ 0</span>
            </div>
            <div class="kpi">
                <h3>Contagem Regressiva</h3>
                <div id="countdown">
                    <span id="cdDias">26</span>d
                    <span id="cdHoras">10</span>h
                    <span id="cdMin">00</span>m
                    <span id="cdSeg">00</span>s
                </div>
            </div>
        </div>

        <div class="charts">
            <div class="chart">
                <canvas id="linhaGrafico"></canvas>
            </div>
            <div id="avisoMeta" style="display: none;">
                Parabens! Voce atingiu a meta de economia!
            </div>
            <div class="chart">
                <canvas id="barraGrafico"></canvas>
            </div>
        </div>
    </div>
        
    <div class="right-section">
            <div class="card">
                <h2>Convidados</h2>
                <input type="text" id="input_convidado" placeholder="Nome do convidado...">
                <button onclick="addConvidado()">Adicionar Convidado</button>
                <div class="lista" id="listaConvidados"></div>
            </div>
            
            <div class="card">
                <h2>Economia</h2>
                <input type="number" id="input_economia" placeholder="Valor economizado...">
                <button onclick="addEconomia()">Adicionar Economia</button>
                <div class="lista" id="listaEconomia"></div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
