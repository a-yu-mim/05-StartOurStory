<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
<style>
#navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
}

body{
    margin: 0;
    font-family: monospace;
    background: #f2f2f2;
    color: #222;
    padding: 80px 0 0 0;
}

.conteudo{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7vw;
    padding: 0px 5%;
    flex-wrap: wrap; /* quebra a linha  */
    align-content: center;
}

img{
    width: 100%;
    max-width: 430px;
}

.texto{
    max-width: 470px;
    align-items: center;
}

.texto h1{
    margin: 30px 0;
    font-size: 50px;
    color: #222;
    text-align: justify;
}

.texto p{
    color: #666;
    font-size: 20px;
    margin-bottom: 35px;
    text-align: justify;
}


button{
    padding: 14px 30px;
    border: none;
    border-radius: 40px;
    background-color: black;
    color: white;
    font-size: 20px;
    cursor: pointer;
    transition: 0.2s;
}

button:hover{
    background-color: #f55246;
}

</style>
</head>
<body>
<div id="navbar"></div>
<script src="/components/navbar.js"></script>

<div class="conteudo">
    <img src="../assets/porta_casal.png">
    <div class="texto">
        <h1>O começo da nossa história antes do 'sim'</h1>
        <p>
            Um espaço calmo e simples para ele, para ela ou para nós.
            Onde cada fragmento guarda a espera por esse momento.
        </p>
        <button onclick="cadastro()">Say yes :)</button>
    </div>
</div>
</body>
</html>
<script>
 
function cadastro() {
    window.location.href = "/pages/cadastro.html";
 }

function login() {
    window.location.href = "/pages/login.html";
}

function sobre() {
    window.location.href = "/pages/sobre.html"
}

</script>
