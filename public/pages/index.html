<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Index</title>
<style>
#navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 2;
}

body{
    margin: 0;
    font-family: monospace;
    background: #f5f5f5;
    color: #2d2d2d;
    padding: 90px 0 0 0;
}

.conteudo{
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 7vw;
    padding: 0px 5%;
    flex-wrap: wrap; /* quebra a linha  */
    align-content: center;
}

.container{
    position: relative;
}

img{
    width: 100%;
    max-width: 430px;
}

.imagem-cima{
    position: absolute;
    z-index: 1;
}

.imagem-baixo{
    z-index: 0;
}


.texto{
    max-width: 470px;
    align-items: center;
}

.texto h1{
    margin: 20px 0;
    font-size: 50px;
    color: #2d2d2d;
    text-align: justify;
}

.texto p{
    color: #666;
    font-size: 18px;
    margin-bottom: 35px;
    text-align: justify;
}

button{
    border: 1px solid #4d4d4d;
    background: transparent;
    color: #2d2d2d;
    padding: 20px 80px;
    border-radius: 40px;
    transition: 0.2s;
    font-size: 20px;
    cursor: pointer;
}

button:hover {
    background: #2d2d2d;
    color: #f5f5f5;
}

#botao {
    position: fixed;
    top: 25px;
    right: 50px;
    width: 60px;
    height: 30px;
    border-radius: 20px;
    border: none;
    padding: 0;
    background: #cccccc;
    cursor: pointer;
    z-index: 3;
}

#alavanca {
    width: 24px;
    height: 24px;
    background: white;
    border-radius: 100%;
    position: absolute;
    top: 3px;
    left: 4px;
    transition: 0.5s;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
    z-index: 3;
}

</style>
</head>
<body id="body">
    <div id="navbar"></div>
    <script src="/components/navbar.js"></script>

    <button id="botao" onclick="darkModo()">
        <div id="alavanca"></div>
    </button>

    <div class="conteudo">
        <div class="container">
        <img class="imagem-cima" src="../assets/porta_fechada.png">
        <img class="imagem-baixo" src="../assets/casal_de_costas.png">
        </div>
        <div class="texto">
            <h1>O começo da nossa história antes do 'sim'</h1>
            <p>
                Um espaço calmo e simples para ele, para ela ou para nós.
                Onde cada fragmento guarda a espera por esse momento.
            </p>
            <button id="btnCadastro" onclick="cadastro()">Diga sim :)</button>
        </div>
    </div>
</body>
</html>
<script>
 
function cadastro() {
    window.location.href = "/pages/cadastro.html";
 }

function darkModo() {
    let fundo = document.getElementById("body");
    let botao = document.getElementById("botao");
    let alavanca = document.getElementById("alavanca");
    let h1 = document.querySelector(".conteudo h1");
    let p = document.querySelector(".conteudo p");
    let botaoCadastro = document.getElementById("btnCadastro");
    let imagemBaixo = document.querySelector(".imagem-baixo");
    let imagemCima = document.querySelector(".imagem-cima");

    if (alavanca.style.left == "32px") {
        botao.style = "";
        alavanca.style = "";
        imagemCima.src = "../assets/porta_fechada.png";
        imagemBaixo.src = "../assets/casal_de_costas.png";
        imagemBaixo.style.opacity = "1";
        fundo.style = "";
        h1.style = "";
        p.style = "";
        botaoCadastro.style = "";
        botaoCadastro.classList.remove("dark");
        botaoCadastro.onmouseenter = null;
        botaoCadastro.onmouseleave = null;
      } else {
        botao.style.background = "#4d4d4d";
        alavanca.style.left = "32px";
        alavanca.style.boxShadow = "0 2px 6px rgba(0, 0, 0, 0.3)";
        imagemCima.src = "../assets/porta_fechada_dark.png";
        imagemBaixo.src = "../assets/casal_de_costas.png";
        imagemBaixo.style.opacity = "0.5";
        fundo.style.background = "#323232";
        h1.style.color = "#f1f1f1";
        p.style.color = "#838383";
        botaoCadastro.style.background = "#323232";
        botaoCadastro.style.color = "#f5f5f5";
        // mouse sai
        botaoCadastro.onmouseleave = function() {
            botaoCadastro.style.background = "#323232";
            botaoCadastro.style.color = "#f5f5f5";
        }
        // mouse entra
        botaoCadastro.onmouseenter = function() {
            botaoCadastro.style.background = "#f1f1f1";
            botaoCadastro.style.color = "#1d1d1d";
        }
    }
}

</script>
