<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login.js" defer></script>
    
</head>
<body id="body">
    <div id="loading">Carregando...</div>

    <button id="botao" onclick="darkModo()"><div id="alavanca"></div></button>

    <div class="card">
        <h2>Fazer Login</h2>
        <input type="email"    id="input_email" placeholder="E-mail">
        <input type="password" id="input_senha" placeholder="Senha">
        <button id="btnEntrar" onclick="login()">Entrar</button>
        <p>Não tem conta? <a href="/pages/cadastro.html" id="link">Cadastrar</a></p>
    </div>

    <div id="alerta">
        <span id="fecharAlerta" onclick="fecharAlerta()">&times;</span>
        <span id="mensagem"></span>
    </div>

    <div id="porta" onclick="irParaHome()">
        <img src="../assets/porta.png" alt="porta">
        <audio id="somPorta" src="../assets/porta-som.mp3"></audio>
    </div>
</body>
</html>
