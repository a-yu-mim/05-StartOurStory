<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Login</title>
    <link rel="stylesheet" href="../css/login.css">
    
</head>
<body id="body">
    <button id="botao" onclick="darkModo()"><div id="alavanca"></div></button>

    <div class="card">
        <h2>Fazer Login</h2>

        <input type="email" id="input_email" placeholder="E-mail">
        <input type="password" id="input_senha" placeholder="Senha">
        <button id="btn-entrar" onclick="login()">Entrar</button>

        <p>Não tem conta? <a href="/pages/cadastro.html" id="link">Comece agora</a></p>
    </div>
</body>
</html>

<script src="../js/login.js"></script>
