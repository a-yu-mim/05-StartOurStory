<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página Cadastro</title>
  <link rel="stylesheet" href="../css/cadastro.css" />
  <script src="../js/cadastro.js" defer></script>

</head>
<body id="body">
  <div id="navbar"></div>
  <script src="/components/navbar.js"></script>
  
  <button id="botao" onclick="darkModo()">
  <div id="alavanca"></div>
  </button>

  <div id="alerta">
    <span id="fecharAlerta" onclick="fecharAlerta()">&times;</span>
    <span id="mensagem"></span>
  </div>

  <div class="card">
    <pp>Nome Completo</pp>
    <input type="text"  id="input_nome">
    <pp>E-mail</pp>
    <input type="email" id="input_email">
    <div class="senha-container">
    <pp>Senha</pp>
    <input type="password" id="input_senha">
    <img id="iconeSenha" src="../assets/olho-fechado.png" onclick="verSenha()">
    </div>
    <pp>Código de convite *</pp>
    <input type="text" id="input_codigo">
    <button id="btnEntrar" onclick="cadastro()">Cadastrar</button>
    <p>Já tem uma conta? <a href="login.html" id="link">Fazer Login</a></p> 
  </div>
  
</body>
</html>
<script>
function darkModo() {
    let body = document.getElementById("body");

    body.classList.toggle("dark");
}
</script>
