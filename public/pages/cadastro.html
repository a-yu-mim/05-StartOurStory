<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css" />
    <script src="../js/cadastro.js" defer></script>

</head>
<body id="body">
  <div id="loading">Carregando...</div>

  <button id="botao" onclick="darkModo()"><div id="alavanca"></div></button>

  <div class="card">
    <h2>Criar Nova Conta</h2>
      <input type="text"  id="input_nome"   placeholder="Nome Completo">
      <input type="email" id="input_email"  placeholder="E-mail">
        <div class="senha-container">
          <input type="password" id="input_senha" placeholder="Senha">
          <button id="verSenha" onclick="verSenha()"><img id="iconeSenha" src="../assets/olho-fechado.png" width="20"  style="opacity: 0.5;"></button>
        </div>
      <input type="text"  id="input_codigo" placeholder="Código do parceiro">
      <button id="btnEntrar" onclick="cadastro()">Cadastrar</button>
      <p>Já tem uma conta? <a href="login.html" id="link">Fazer Login</a></p> 
  </div>

  <div id="alerta">
      <span id="fecharAlerta" onclick="fecharAlerta()">&times;</span>
      <span id="mensagem"></span>
  </div>
</body>
</html>
